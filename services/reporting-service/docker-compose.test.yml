version: "3.9"

services:
  audit-log-service:
    build:
      context: ../../
      dockerfile: services/reporting-service/tests/Dockerfile.audit
    ports:
      - "18089:8089"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/v1/events/_health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  reporting-service:
    build:
      context: ../../
      dockerfile: services/reporting-service/tests/Dockerfile.reporting
    ports:
      - "18091:8091"
    environment:
      AUDIT_SERVICE_URL: "http://audit-log-service:8089"
      REPORTS_DIR: "/tmp/reports"
    depends_on:
      audit-log-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
