name: python

on:
  push:
    branches: [main]
    paths:
      - "services/fraud-detection-service/**"
      - "services/audit-log-service/**"
      - "services/kyc-service/**"
      - "services/reporting-service/**"
      - "shared-libs/py-commons/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "services/fraud-detection-service/**"
      - "services/audit-log-service/**"
      - "services/kyc-service/**"
      - "services/reporting-service/**"
      - "shared-libs/py-commons/**"
      - ".github/workflows/python.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        service:
          - fraud-detection-service
          - audit-log-service
          - kyc-service
          - reporting-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install py-commons (prereq)
        run: pip install -e shared-libs/py-commons

      - name: install ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[dev]"

      - name: byte-compile sanity
        working-directory: services/${{ matrix.service }}
        run: python -m compileall -q app

      - name: test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        # Several Python services intentionally ship without tests; treat missing suite as pass.
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "no tests directory; skipping"
          fi
